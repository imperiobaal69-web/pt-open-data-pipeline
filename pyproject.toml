[project]
name = "pt-open-data-pipeline"
version = "0.1.0"
description = "Reproducible ELT pipeline for Portuguese card-spend open data (INE / SIBS) with DuckDB and dbt."
authors = [
    { name = "Paulo", email = "imperiobaal69-web@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
]

[project.scripts]
ptdata = "ptdata.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ptdata"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
